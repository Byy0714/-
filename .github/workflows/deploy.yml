# 自动部署到 GitHub Pages
# 用法：把项目推到 GitHub 仓库后，把下面的 <username>/<repo> 替换成你自己的，
#       然后 Settings → Pages → Source 选 GitHub Actions。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build with relative base (GitHub Pages)
        run: |
          cat > _vite.base.mjs <<'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          import baseConfig from './vite.config.js'
          export default defineConfig({
            ...baseConfig,
            base: './',
          })
          EOF
          node -e "
            const fs=require('fs');
            const cfg=fs.readFileSync('vite.config.js','utf8');
            fs.writeFileSync('vite.config.js',cfg.replace('defineConfig({','defineConfig({ base:\\'./\\','));
          "
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
